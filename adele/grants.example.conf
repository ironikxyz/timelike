# Adele's grants — the operator's file (feature 004; spec FR-5, FR-6; data-model § Grant file).
#
# `make up` copies this file to adele/grants.conf if that is absent (git-ignored, never overwritten).
# Edit adele/grants.conf, not this one. Adele reads it once, at start, read-only; a malformed file stops
# her with `grants.conf:<line>: <what> — <how to fix>`. Restart her to apply an edit:
#   docker compose up -d --force-recreate adele
# To extend a limit while she runs, use the command a refusal prints, for example:
#   docker exec timelike-adele adeled extend demo budget 2.00 USD
#
# Each grant is a section. Every key is required:
#   capabilities  comma-separated; slice 0 knows one: standin.box (the in-compose stand-in, not a provider)
#   budget        total estimated cost of performed requests, USD, at most 2 decimals
#   ttl           longest lifetime of any resource created (Go duration, 1m to 720h)
#   instances     most resources live at once under this grant
#   ports         ports a resource may expose: single ports and ranges, or `none`

[grant demo]
capabilities = standin.box
budget = 1.00 USD
ttl = 1h
instances = 2
ports = 8080
