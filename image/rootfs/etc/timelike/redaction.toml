# The redaction rule set (contract rule 15), shared by two readers so it cannot diverge:
#   - `run` (feature 003, through agentio.load_redaction_rules) replaces each secret it finds in what it
#     shows and stores with [REDACTED:<type>], where <type> comes from the rule's one `redact:<type>` tag;
#   - `make scan`'s gitleaks step (scan/scan.sh, --config) scans the repository's history with it.
# Format: gitleaks' own config. `useDefault` keeps gitleaks' default rules for the scan. The rules below
# are 18 of those defaults, copied byte for byte from gitleaks v8.30.1 config/gitleaks.toml (the version
# pins.env pins), each with one `tags` line added; a same-id rule here overrides the default, unchanged
# but for the tag (003 research R15, checked with the pinned binary). To add a rule: copy it from the
# pinned defaults, add its tag, and say so in a cycle report. Never write a sample secret in this file.
title = "timelike redaction rules (gitleaks v8.30.1 defaults, 18 tagged)"

[extend]
useDefault = true

[[rules]]
id = "anthropic-admin-api-key"
description = "Detected an Anthropic Admin API Key, risking unauthorized access to administrative functions and sensitive AI model configurations."
regex = "\\b(sk-ant-admin01-[a-zA-Z0-9_\\-]{93}AA)(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
keywords = ["sk-ant-admin01"]
tags = ["redact:key"]

[[rules]]
id = "anthropic-api-key"
description = "Identified an Anthropic API Key, which may compromise AI assistant integrations and expose sensitive data to unauthorized access."
regex = "\\b(sk-ant-api03-[a-zA-Z0-9_\\-]{93}AA)(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
keywords = ["sk-ant-api03"]
tags = ["redact:key"]

[[rules]]
id = "aws-access-token"
description = "Identified a pattern that may indicate AWS credentials, risking unauthorized cloud resource access and data breaches on AWS platforms."
regex = "\\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\\b"
entropy = 3
keywords = ["a3t", "akia", "asia", "abia", "acca"]
tags = ["redact:credential"]
[[rules.allowlists]]
regexes = [".+EXAMPLE$"]

[[rules]]
id = "gcp-api-key"
description = "Uncovered a GCP API key, which could lead to unauthorized access to Google Cloud services and data breaches."
regex = "\\b(AIza[\\w-]{35})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
entropy = 4
keywords = ["aiza"]
tags = ["redact:key"]
[[rules.allowlists]]
regexes = ["AIzaSyabcdefghijklmnopqrstuvwxyz1234567", "AIzaSyAnLA7NfeLquW1tJFpx_eQCxoX-oo6YyIs", "AIzaSyCkEhVjf3pduRDt6d1yKOMitrUEke8agEM", "AIzaSyDMAScliyLx7F0NPDEJi1QmyCgHIAODrlU", "AIzaSyD3asb-2pEZVqMkmL6M9N6nHZRR_znhrh0", "AIzayDNSXIbFmlXbIE6mCzDLQAqITYefhixbX4A", "AIzaSyAdOS2zB6NCsk1pCdZ4-P6GBdi_UUPwX7c", "AIzaSyASWm6HmTMdYWpgMnjRBjxcQ9CKctWmLd4", "AIzaSyANUvH9H9BsUccjsu2pCmEkOPjjaXeDQgY", "AIzaSyA5_iVawFQ8ABuTZNUdcwERLJv_a_p4wtM", "AIzaSyA4UrcGxgwQFTfaI3no3t7Lt1sjmdnP5sQ", "AIzaSyDSb51JiIcB6OJpwwMicseKRhhrOq1cS7g", "AIzaSyBF2RrAIm4a0mO64EShQfqfd2AFnzAvvuU", "AIzaSyBcE-OOIbhjyR83gm4r2MFCu4MJmprNXsw", "AIzaSyB8qGxt4ec15vitgn44duC5ucxaOi4FmqE", "AIzaSyA8vmApnrHNFE0bApF4hoZ11srVL_n0nvY"]

[[rules]]
id = "github-app-token"
description = "Identified a GitHub App Token, which may compromise GitHub application integrations and source code security."
regex = "(?:ghu|ghs)_[0-9a-zA-Z]{36}"
entropy = 3
keywords = ["ghu_", "ghs_"]
tags = ["redact:token"]
[[rules.allowlists]]
paths = ["(?:^|/)@octokit/auth-token/README\\.md$"]

[[rules]]
id = "github-fine-grained-pat"
description = "Found a GitHub Fine-Grained Personal Access Token, risking unauthorized repository access and code manipulation."
regex = "github_pat_\\w{82}"
entropy = 3
keywords = ["github_pat_"]
tags = ["redact:token"]

[[rules]]
id = "github-oauth"
description = "Discovered a GitHub OAuth Access Token, posing a risk of compromised GitHub account integrations and data leaks."
regex = "gho_[0-9a-zA-Z]{36}"
entropy = 3
keywords = ["gho_"]
tags = ["redact:token"]

[[rules]]
id = "github-pat"
description = "Uncovered a GitHub Personal Access Token, potentially leading to unauthorized repository access and sensitive content exposure."
regex = "ghp_[0-9a-zA-Z]{36}"
entropy = 3
keywords = ["ghp_"]
tags = ["redact:token"]
[[rules.allowlists]]
paths = ["(?:^|/)@octokit/auth-token/README\\.md$"]

[[rules]]
id = "github-refresh-token"
description = "Detected a GitHub Refresh Token, which could allow prolonged unauthorized access to GitHub services."
regex = "ghr_[0-9a-zA-Z]{36}"
entropy = 3
keywords = ["ghr_"]
tags = ["redact:token"]

[[rules]]
id = "gitlab-pat"
description = "Identified a GitLab Personal Access Token, risking unauthorized access to GitLab repositories and codebase exposure."
regex = "glpat-[\\w-]{20}"
entropy = 3
keywords = ["glpat-"]
tags = ["redact:token"]

[[rules]]
id = "jwt"
description = "Uncovered a JSON Web Token, which may lead to unauthorized access to web applications and sensitive user data."
regex = "\\b(ey[a-zA-Z0-9]{17,}\\.ey[a-zA-Z0-9\\/\\\\_-]{17,}\\.(?:[a-zA-Z0-9\\/\\\\_-]{10,}={0,2})?)(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
entropy = 3
keywords = ["ey"]
tags = ["redact:token"]

[[rules]]
id = "npm-access-token"
description = "Uncovered an npm access token, potentially compromising package management and code repository access."
regex = "(?i)\\b(npm_[a-z0-9]{36})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
entropy = 2
keywords = ["npm_"]
tags = ["redact:token"]

[[rules]]
id = "openai-api-key"
description = "Found an OpenAI API Key, posing a risk of unauthorized access to AI services and data manipulation."
regex = "\\b(sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})\\b|sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
entropy = 3
keywords = ["t3blbkfj"]
tags = ["redact:key"]

[[rules]]
id = "private-key"
description = "Identified a Private Key, which may compromise cryptographic security and sensitive data encryption."
regex = "(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\\s\\S-]{64,}?KEY(?: BLOCK)?-----"
keywords = ["-----begin"]
tags = ["redact:key"]

[[rules]]
id = "pypi-upload-token"
description = "Discovered a PyPI upload token, potentially compromising Python package distribution and repository integrity."
regex = "pypi-AgEIcHlwaS5vcmc[\\w-]{50,1000}"
entropy = 3
keywords = ["pypi-ageichlwas5vcmc"]
tags = ["redact:token"]

[[rules]]
id = "slack-bot-token"
description = "Identified a Slack Bot token, which may compromise bot integrations and communication channel security."
regex = "xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*"
entropy = 3
keywords = ["xoxb"]
tags = ["redact:token"]

[[rules]]
id = "slack-user-token"
description = "Found a Slack User token, posing a risk of unauthorized user impersonation and data access within Slack workspaces."
regex = "xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}"
entropy = 2
keywords = ["xoxp-", "xoxe-"]
tags = ["redact:token"]

[[rules]]
id = "stripe-access-token"
description = "Found a Stripe Access Token, posing a risk to payment processing services and sensitive financial data."
regex = "\\b((?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
entropy = 2
keywords = ["sk_test", "sk_live", "sk_prod", "rk_test", "rk_live", "rk_prod"]
tags = ["redact:secret"]
