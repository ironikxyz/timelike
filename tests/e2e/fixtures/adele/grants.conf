# The e2e lane's grant file (feature 004). tests/run.sh starts Adele on this file, never on the
# operator's adele/grants.conf, after clearing her volumes, so every run starts from an empty ledger.
# One grant per refusal cell and invocation style, so no cell's spending or extension reaches another.

# A roomy grant for "within the grant" requests (SC-1, SC-3, SC-5).
[grant e2e]
capabilities = standin.box
budget = 100.00 USD
ttl = 2h
instances = 500
ports = 8080, 9000-9010

[grant ttl-c]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant ttl-lc]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant ports-c]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant ports-lc]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant inst-c]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 1
ports = 8080

[grant inst-lc]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 1
ports = 8080

# 0.30 USD fits one 1h box (0.25 USD) and not two.
[grant budget-c]
capabilities = standin.box
budget = 0.30 USD
ttl = 1h
instances = 50
ports = 8080

[grant budget-lc]
capabilities = standin.box
budget = 0.30 USD
ttl = 1h
instances = 50
ports = 8080

# SC-4's full request cycle: performed, refused (port), extended, retried.
[grant leak]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080
