# The e2e lane's grant file (feature 004). tests/run.sh starts Adele on this file, never on the
# operator's adele/grants.conf, after clearing her volumes, so every run starts from an empty ledger.
# One grant per refusal cell and invocation style, so no cell's spending or extension reaches another.

# A roomy grant for "within the grant" requests (SC-1, SC-3, SC-5).
[grant e2e]
capabilities = standin.box
budget = 100.00 USD
ttl = 2h
instances = 500
ports = 8080, 9000-9010

[grant ttl-c]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant ttl-lc]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant ports-c]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant ports-lc]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant inst-c]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 1
ports = 8080

[grant inst-lc]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 1
ports = 8080

# 0.30 USD fits one 1h box (0.25 USD) and not two.
[grant budget-c]
capabilities = standin.box
budget = 0.30 USD
ttl = 1h
instances = 50
ports = 8080

[grant budget-lc]
capabilities = standin.box
budget = 0.30 USD
ttl = 1h
instances = 50
ports = 8080

# SC-4's full request cycle: performed, refused (port), extended, retried.
[grant leak]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

# Slice 1's reaper (SC-7): its own grants, so the boxes it lets expire and the reaps they get move no
# other cell's counts. `reap` is the spread file's, `reap-serial` the serial file's (Adele and the stand-in
# stopped and started). ttl 1m, the grant file's minimum, is what each cell asks for.
[grant reap]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

[grant reap-serial]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

# Slice 1's status (FR-36): refusals by host, on ports, never extended.
[grant deny]
capabilities = standin.box
budget = 10.00 USD
ttl = 1h
instances = 50
ports = 8080

# Feature 13 slice 0: nested environments (docker.compose). `nested` is the roomy one every bring-up cell uses;
# `nested-one` allows one environment, for the instances refusal; `nested-reap` is the reap cell's, whose
# environment asks for the shortest lifetime. Budget 0.00: an environment is local and costs nothing.
[grant nested]
capabilities = docker.compose
budget = 0.00 USD
ttl = 2h
instances = 100
ports = none

[grant nested-one]
capabilities = docker.compose
budget = 0.00 USD
ttl = 2h
instances = 1
ports = none

[grant nested-reap]
capabilities = docker.compose
budget = 0.00 USD
ttl = 1h
instances = 10
ports = none

# Feature 13 slice 2: snapshots of an environment's volumes (014 plan R29, R33). Each failure that needs a cap or a
# store of its own has its grant, so no cell's snapshots fill another's. `nested-snapcap` caps an environment's
# snapshots at 64 KiB, for the refusal; `nested-snapfull` holds them in a tmpfs of 1 MiB, so the disk-full cell fills
# memory bounded at 1 MiB and never the host's disk; `nested-snapmem` holds them in a tmpfs of 256 MiB, so a copy of
# many empty files works in memory, long enough for the runner to kill its helper (the kill cell, and the serial
# file that kills Adele mid-snapshot). Every other cell's environment takes `nested`'s default: 1 GiB, in volumes.
[grant nested-snapcap]
capabilities = docker.compose
budget = 0.00 USD
ttl = 2h
instances = 10
ports = none
snapshots = 64KiB

[grant nested-snapfull]
capabilities = docker.compose
budget = 0.00 USD
ttl = 2h
instances = 10
ports = none
snapshots = 1MiB
snapshot-store = tmpfs

[grant nested-snapmem]
capabilities = docker.compose
budget = 0.00 USD
ttl = 2h
instances = 10
ports = none
snapshots = 256MiB
snapshot-store = tmpfs
