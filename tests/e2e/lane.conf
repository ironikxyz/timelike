# The parallel e2e lane's file list (bridge/sends/maint-lane-speed-20261015-062546.md, part 1a), read by
# tests/run.sh when E2E_JOBS > 1. A serial lane (E2E_JOBS=1) reads nothing here and runs `bats tests/e2e`.
#
# One file per line: a kind, the file's name in tests/e2e, then `#` and why. tests/run.sh refuses a name
# that is not a file there, so a renamed file cannot quietly lose its place.
#
#   first   started before the other files, longest first. The longest file sets the lane's floor, so it
#           should not start last (its time in lane 02s1-d, c09f94a, from tests/out/report.xml)
#   serial  runs with no other file beside it, after every other file (lane.bash's exclusive lock):
#           its cells measure the machine, or read state that any neighbour changes. As a class, that
#           includes every file with an assert_within budget less than 15 s above what its timed command
#           takes on a quiet host: a loaded lane (proof 4's par3b) put 15 s on one 0.5 s command, and failed
#           a 10 s criterion (feedback maint-20261015-115635, item 11). A cell's time is mostly its setup,
#           so the headroom is read from tests/out/within.tsv, assert_within's own record; until a lane has
#           written one, a file's quietest cell time in proof 4 stood in for it, which overstates the use
#
# Every other file runs beside any other, in name order. A parallel lane's plan order is therefore: the
# `first` files in the order below, the rest by name, then the `serial` files by name.
#
# Why the rest can run side by side: the isolation survey of all 86 files (maint-lane-speed cycle report).
# Each cell uses its own mktemp work dir, state root and session. No file binds a fixed port, names a fixed
# container, network or volume, or brings compose up or down. The helpers that acted on the whole container
# act on the calling file's own processes in a parallel lane (helpers.bash: kill_strays,
# assert_no_pager_or_editor), and the throwaway-container sweep runs once, in tests/run.sh, before the lane.

first   git-log-diff-commit-rebase-exit-within-20-seconds.bats  # 362 s. Its 20 s budgets are 13 s above its quietest cell (6.8 s), but each cell first builds a fixture repository (prepare), so the git command's own share is not known; within.tsv decides. Serial, it would add about 507 s
first   speedup-bench.bats  # 274 s
first   the-same-task-catalog-runs-under-two-harnesses-and-the-report-shows-results-per-harness.bats  # 267 s

serial  a-bare-python-package-install-and-a-global-node-package-install-succeed-without-privilege.bats  # installs into the shared ~/.local by design, and its check runs find / -xdev for anything new outside the home directory, so any neighbour's write fails it
serial  adele-reaps-after-restart-and-records-standin-unreachable.bats  # stops Adele and the stand-in (a restart across an expiry, a provider unreachable): every Adele file a neighbour runs would fail while they are down
serial  adele-rejects-malformed-grant-with-line-at-fault.bats  # a 10 s window that includes the throwaway Adele's docker run: a malformed file must exit inside it and a valid one still serve at its end
serial  announcement-at-most-60-lines-in-each-harness-user-level-context-on-start.bats  # waits at most 10 s for each throwaway's entrypoint, and placement has taken 11 s under host I/O load
serial  command-not-installed-exits-127-and-prints-the-install-command.bats  # requires nothing new anywhere under $HOME and the listed commands absent from PATH; neighbours' shells and installs write there
serial  conformance-check-over-every-timelike-tool-on-path.bats  # assert_within 60 on cells of 9.1-9.6 s in every lane-speed lane, yet 62.3 s, 24.8 s, 17.9 s and 15.1 s in lane 12s1a (df52dbf), where it started first, beside the Go step (260 s there, 33 s before): load moves it by over 50 s, so the 15 s rule's headroom is not enough. Its tools were not slower: adele's probe costs 140 ms on HEAD and on master (004 Cycle 4, addendum 1)
serial  credentials-fail-fast.bats  # assert_within 10 for commands that take under 1 s quiet; a loaded lane put 15.2 s on one (par3b, cell 176)
serial  failed-commands-are-grouped-into-categories-including-command-not-found-module-not-found-timeout-memory-kill-and-network-denial.bats  # each probe has the bench's 5 s call limit, and cold starts in a new 64 MiB container must finish inside it or are classed timeout
serial  hook-past-its-time-limit-is-killed.bats  # assert_within 8 and 7 for 3 s and 2 s hook limits, timed from the runner: about 5 s of headroom
serial  hooks-under-env-i-default-bounded-local-unbounded.bats  # assert_within 7 for a 2 s limit plus its 5 s grace
serial  installing-a-package-name-absent-from-its-registry-is-refused-with-exit-4-before-anything-is-downloaded.bats  # npm install -g into the shared ~/.local, and it requires nothing else new there
serial  installing-a-package-whose-newest-release-is-younger-than-the-minimum-age-is-refused-naming-the-release-date.bats  # requires nothing new in ~/.local or the agent's site-packages but its own cell's
serial  journal-concurrent-agents-separable-by-agent-and-session.bats  # assert_within 20 on cells of up to 5.9 s quiet: under 15 s of headroom
serial  journal-last-20-entries-of-current-session-bounded.bats  # assert_within 20 on cells of up to 9.0 s quiet: under 15 s of headroom
serial  no-credential-held-by-adele-appears-in-agent.bats  # tars the whole filesystem under a 120 s cap; under load the cap could cut the search short and pass it without looking
